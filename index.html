<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Κουίζ Αισθητικής Τέχνης</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE everyday study, warm and calm, made for a phone
   IDEA a salon treatment card: one card at a time on a blush vanity, the answer marked like a stamp
   PICTURE the question card itself, large, with big tappable answers that turn green or red
   COLOUR blush ground, deep berry band, rose accent; green for right, red for wrong
   TYPE Commissioner (Greek) for both display and text
   LAYOUT berry band with title, score ring and progress; chips; the card; prev/next bar sticky on phones */
:root{color-scheme:light dark;--bg:light-dark(#fbeef0,#1b0e14);--ink:light-dark(#2b0f1d,#f7e6ec);--soft:light-dark(#6e4a5a,#c9a9b6);--band:light-dark(#6d1a43,#3a0f25);--card:light-dark(#ffffff,#2a1620);--line:light-dark(#f0d3db,#4a2a38);--rose:light-dark(#d6406c,#ff7aa0);--ok:light-dark(#1c8a5a,#4fd197);--okbg:light-dark(#e3f6ec,#123526);--bad:light-dark(#c62f3c,#ff7d86);--badbg:light-dark(#fde6e8,#3d161b);--warn:light-dark(#8a5a00,#f2c46b);--warnbg:light-dark(#fff3d6,#3a2c10)}
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.55 Commissioner,"Noto Sans",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit}
.band{background:var(--band);color:#fff;padding:22px max(5vw,16px) 18px}
.top{max-width:860px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
h1{margin:0;font-size:clamp(28px,6vw,42px);line-height:1.05;letter-spacing:-.02em;font-weight:800;text-wrap:balance}
.sub{margin:6px 0 0;color:#f4cdda;font-size:15px}
.ring{width:84px;height:84px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px;line-height:1.1;text-align:center}
.ring b span{display:block;font-size:12px;font-weight:500;color:#f4cdda}
.bar{max-width:860px;margin:14px auto 0;height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .g{background:#5fe0a5}.bar .r{background:#ff8b9b}
.wrap{max-width:860px;margin:0 auto;padding:16px max(5vw,16px) 110px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:9px 15px;min-height:44px;cursor:pointer;font-size:15px;font-weight:600}
.chip[aria-pressed=true]{background:var(--rose);border-color:var(--rose);color:#fff}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.tool{border:0;background:transparent;color:var(--soft);font-size:15px;font-weight:600;padding:10px 8px;min-height:44px;cursor:pointer;border-radius:10px}
.tool[aria-pressed=true]{color:var(--rose)}
.tool:hover{background:var(--line)}
.jump{display:flex;align-items:center;gap:6px;margin-left:auto;color:var(--soft);font-size:15px}
.jump input{width:96px;font-size:16px;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
.card{background:var(--card);border-radius:22px;padding:clamp(20px,4vw,34px);box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(109,26,67,.45);border:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px;font-size:14px;color:var(--soft);font-weight:600}
.num{background:var(--band);color:#fff;border-radius:10px;padding:3px 10px;font-weight:700}
.pill{border-radius:999px;padding:3px 10px;font-size:13px}
.pill.neg{background:var(--badbg);color:var(--bad)}
.pill.warn{background:var(--warnbg);color:var(--warn)}
.q{font-size:clamp(20px,3.6vw,25px);line-height:1.35;font-weight:600;margin:0 0 20px;text-wrap:pretty}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;border:2px solid var(--line);background:transparent;border-radius:16px;padding:14px 16px;min-height:56px;cursor:pointer;font-size:17px;line-height:1.4;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--rose)}
.opt:focus-visible,.chip:focus-visible,.tool:focus-visible,.nav button:focus-visible,.big:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
.opt .k{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);font-weight:700;font-size:15px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .k{background:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.bad .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.tf{grid-template-columns:1fr 1fr}
.tf .opt{justify-content:center;font-weight:700;font-size:19px;min-height:64px}
.tf .opt .k{display:none}
.fb{margin-top:16px;border-radius:14px;padding:14px 16px;font-weight:600;font-size:16px;display:none}
.fb.show{display:block}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb small{display:block;font-weight:500;color:var(--ink);margin-top:4px;font-size:15px}
.list{margin:0 0 8px;padding:0;list-style:none;display:grid;gap:8px}
.list li{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;font-size:16px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.cols h3,.sol h3{margin:0 0 8px;font-size:14px;color:var(--soft)}
.sol{display:none;margin-top:16px;border-radius:16px;padding:16px;background:var(--okbg)}
.sol.show{display:block}
.sol h3{color:var(--ok)}
.sol ol{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.sol li{font-size:16px;font-weight:600}
.sol p{margin:10px 0 0;font-size:15px;color:var(--soft)}
.big{border:0;border-radius:14px;padding:14px 20px;min-height:52px;font-weight:700;font-size:17px;cursor:pointer;background:var(--rose);color:#fff}
.self{display:none;gap:10px;margin-top:12px;flex-wrap:wrap}
.self.show{display:flex}
.self .big{flex:1 1 140px}
.self .y{background:var(--ok)}.self .n{background:var(--bad)}
.nav{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 14px;display:flex;gap:10px;margin-top:6px}
.nav button{flex:1;border:2px solid var(--band);background:var(--card);border-radius:14px;min-height:52px;font-weight:700;font-size:17px;cursor:pointer}
.nav .next{background:var(--band);color:#fff}
.where{text-align:center;color:var(--soft);font-size:14px;margin-top:2px}
.empty{text-align:center;padding:30px 10px;color:var(--soft)}
.done{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.97)}100%{transform:scale(1)}}
@media(prefers-reduced-motion:reduce){.done{animation:none}.opt{transition:none}}
@media(max-width:600px){.cols{grid-template-columns:1fr}.ring{width:70px;height:70px}.jump{margin-left:0}.q{font-size:20px}}
</style>
</head>
<body>
<header class="band">
  <div class="top">
    <div>
      <h1>Κουίζ Αισθητικής Τέχνης</h1>
      <p class="sub">217 ερωτήσεις πιστοποίησης ΕΠΑ.Λ. Πάτα μια απάντηση για να δεις αν είναι σωστή.</p>
    </div>
    <div class="ring" aria-live="polite"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15.5" fill="none" stroke="rgba(255,255,255,.2)" stroke-width="4"/><circle id="arc" cx="18" cy="18" r="15.5" fill="none" stroke="#5fe0a5" stroke-width="4" stroke-linecap="round" stroke-dasharray="0 100" pathLength="100"/></svg><b id="score">0/0<span>σωστές</span></b></div>
  </div>
  <div class="bar" id="bar"><i class="g"></i><i class="r"></i></div>
</header>
<main class="wrap">
  <div class="chips" id="chips" role="toolbar" aria-label="Ενότητες"></div>
  <div class="tools">
    <button class="tool" id="shuf" aria-pressed="false">Ανακάτεμα</button>
    <button class="tool" id="wrong" aria-pressed="false">Μόνο τα λάθη μου</button>
    <button class="tool" id="reset">Από την αρχή</button>
    <label class="jump" for="go">Ερώτηση <input id="go" type="number" inputmode="numeric" min="1" max="217" placeholder="1–217"></label>
  </div>
  <article class="card" id="card"></article>
  <div class="nav"><button id="prev">Προηγούμενη</button><button class="next" id="next">Επόμενη</button></div>
  <div class="where" id="where"></div>
</main>
<script>
{
const Q=[{"n":1,"s":"mc","k":"mc","q":"Αν μία πελάτισσα κακολογήσει μία συνάδελφο σας, πως θα αντιδράσετε;","o":[["α","Θα το αναφέρετε στη συνάδελφό σας"],["β","Θα το αναφέρετε στον προϊστάμενο σας"],["γ","Θα συμφωνήσετε με την πελάτισσα αν έχει δίκιο"],["δ","Δεν θα δώσετε συνέχεια στη συζήτηση"]],"a":"δ","neg":false,"u":false},{"n":2,"s":"mc","k":"mc","q":"Αν δείτε μια νέα μέθοδο περιποίησης:","o":[["α","Θα την εφαρμόσετε αμέσως"],["β","Θα την εφαρμόσετε αν το ζητήσει η πελάτισσα"],["γ","Θα την απορρίψετε"],["δ","Πριν την εφαρμόσετε, θα κρίνετε σύμφωνα με τις γνώσεις σας αν είναι αποδεκτή."]],"a":"δ","neg":false,"u":false},{"n":3,"s":"mc","k":"mc","q":"Τα εργαλεία αισθητικής αποστειρώνονται ως εξής:","o":[["α","Πλένονται με σαπούνι και νερό και τοποθετούνται στους χώρους φύλαξης"],["β","Πλένονται με σαπούνι και νερό και αφού στεγνώσουν σε σκιερό μέρος τοποθετούνται στο κλίβανο αποστείρωσης ή στην υπεριώδη ακτινοβολία"],["γ","Τοποθετούνται κατευθείαν στον κλίβανο αποστείρωσης"],["δ","Χρησιμοποιείται ισχυρό απολυμαντικό."]],"a":"β","neg":false,"u":false},{"n":4,"s":"mc","k":"mc","q":"Η πελάτισσα νιώθει αδιαθεσία και τάση λιποθυμίας την ώρα που ετοιμάζεστε να την σηκώσετε από την πολυθρόνα στην καμπίνα προσώπου. Πως αντιδράτε;","o":[["α","Την σηκώνετε και της προσφέρετε ένα ποτήρι νερό"],["β","Την σηκώνετε και φωνάζετε τον υπεύθυνο γιατρό του κέντρου"],["γ","Την κρατάτε ξαπλωμένη σηκώνοντας τα πόδια της πιο ψηλά και ζητάτε από κάποιο συνάδελφο σας να καλέσει τον γιατρό του κέντρου"],["δ","Φωνάζετε δυνατά βοήθεια για να πλησιάσει κάποιος που γνωρίζει να την βοηθήσει"]],"a":"γ","neg":false,"u":false},{"n":5,"s":"mc","k":"mc","q":"Μία πελάτισσα, σας παρακαλεί να κρατήσει το κινητό της, γιατί περιμένει ένα σημαντικό τηλεφώνημα ενώ θα βρίσκεται στην συσκευή φαραδικού ρεύματος. Πως αντιδράτε;","o":[["α","Της χαμογελάτε και της εξηγείτε ότι δεν επιτρέπεται."],["β","Της το επιτρέπετε, εξηγώντας της όμως ότι είναι η τελευταία φορά"],["γ","Της εξηγείτε τους λόγους που δεν επιτρέπεται για την δική της ασφάλεια να κρατάει το κινητό της και το απομακρύνετε από την καμπίνα"],["δ","Είστε πολύ αυστηρή και της κάνετε παρατήρηση και μόνο που έχει το κινητό της μέσα στην καμπίνα, μπορεί να προκαλέσει ατύχημα σε κάποιο άλλο πελάτη"]],"a":"γ","neg":false,"u":false},{"n":6,"s":"mc","k":"mc","q":"Ποια από τις παρακάτω προωθητικές ενέργειες δεν συστήνεται για την ανάπτυξη μιας επιχείρησης αισθητικής και ευεξίας;","o":[["α","Μείωση τιμής κάποιων υπηρεσιών ή προϊόντων"],["β","Παροχή δώρων"],["γ","Δυσφήμιση των ανταγωνιστικών επιχειρήσεων"],["δ","Κουπόνια προσφοράς"],["ε","Δωρεάν δοκιμές"]],"a":"γ","neg":false,"u":false},{"n":7,"s":"mc","k":"mc","q":"Βρείτε το λάθος που μπορεί να κάνει ένας υποψήφιος εργαζόμενος, σε μία συνέντευξη με εργοδότη.","o":[["α","Είναι παρών ακριβώς στην ώρα της συνάντησης"],["β","Διακόπτει τον συνομιλητή του"],["γ","Με την είσοδό του χαιρετά όλους τους παρευρισκόμενους"],["δ","Ζητάει λίγο χρόνο για να σκεφτεί την απάντηση"]],"a":"β","neg":false,"u":false},{"n":8,"s":"mc","k":"mc","q":"Η μηχανογράφηση όλων των αποθεμάτων (προϊόντων) που υπάρχουν σε μία αποθήκη:","o":[["α","Είναι προαιρετική"],["β","Διευκολύνει τον εργοδότη"],["γ","Είναι απαραίτητη σύμφωνα με τον Ευρωπαϊκό Οργανισμό για την Ασφάλεια και Υγεία στην Εργασία (OSHA)"],["δ","Δεν πρέπει να υπάρχει"]],"a":"β","neg":false,"u":false},{"n":9,"s":"mc","k":"mc","q":"Σε ποιον από τους παρακάτω τύπους δέρματος αντενδείκνυται η μάλαξη προσώπου;","o":[["α","Στον αφυδατωμένο τύπο"],["β","Στον ακνεικό τύπο"],["γ","Στον ώριμο τύπο"],["δ","Στον φωτογηρασμένο"]],"a":"β","neg":false,"u":false},{"n":10,"s":"mc","k":"mc","q":"Σε μία ενυδάτωση προσώπου, σε ποια περιοχή πρέπει να αποφεύγεται η μαλάξη;","o":[["α","Γύρω από τα μάτια"],["β","Στο πάνω βλέφαρο"],["γ","Στον θυρεοειδή αδένα"],["δ","Στο ντεκολτέ"]],"a":"γ","neg":false,"u":false},{"n":11,"s":"mc","k":"mc","q":"Σε ποια περίπτωση επιτρέπεται το peeling τριβής;","o":[["α","Στα αφυδατωμένα δέρματα"],["β","Σε δέρματα με ευρυάγγειες"],[" function render(anim){
  const c=document.getElementById("card"),w=document.getElementById("where");
  if(!list.length){c.innerHTML=`<div class="empty">${st.wrong?"Δεν έχεις λάθη σε αυτή την ενότητα. Μπράβο!":"Δεν υπάρχουν ερωτήσεις εδώ."}</div>`;w.textContent="";return}
  const x=list[st.pos],done=st.res[x.n];
  let h=`<div class="meta"><span class="num">${x.n}</span><span>${SN[x.s]}</span>${x.neg?'<span class="pill neg">Βρες τη ΛΑΘΟΣ πρόταση</span>':""}${x.u?'<span class="pill warn">Αβέβαιη απάντηση, έλεγξε με το βιβλίο</span>':""}</div><p class="q">${esc(x.q)}</p>`;
  if(x.k==="mc"){
    h+=`<div class="opts${x.s==="tf"?" tf":""}">`+x.o.map(([k,t])=>`<button class="opt" data-k="${esc(k)}"><span class="k">${esc(k)}</span><span>${esc(t)}</span></button>`).join("")+`</div><div class="fb" id="fb"></div>`;
  }else{
    if(x.s==="match"&&x.r&&x.r.length){h+=`<div class="cols"><div><h3>Στήλη 1</h3><ul class="list">${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div><div><h3>Στήλη 2</h3><ul class="list">${x.r.map(i=>`<li>${esc(i)}</li>`).join("")}</ul></div></div>`}
    else if(x.items.length){h+=`<ul class="list">${x.items.map(i=>`<li>${esc(i)}</li>`).join("")}</ul>`}
    h+=`<button class="big" id="show">Δείξε τη λύση</button><div class="sol" id="sol"><h3>Σωστή απάντηση</h3><ol>${x.sol.map(i=>`<li>${esc(i)}</li>`).join("")}</ol>${x.note?`<p>${esc(x.note)}</p>`:""}</div><div class="self" id="self"><button class="big y" data-v="ok">Το ήξερα</button><button class="big n" data-v="bad">Δεν το ήξερα</button></div>`;
  }
  c.innerHTML=h;
  if(anim){c.classList.remove("done");void c.offsetWidth;c.classList.add("done")}
  w.textContent=`${st.pos+1} από ${list.length}`;
  if(done&&x.k==="mc"&&st.pick&&st.pick[x.n])mark(x,st.pick[x.n],false);
  if(done&&x.k==="rev"){document.getElementById("sol").classList.add("show");document.getElementById("show").style.display="none"}
}
function mark(x,k,count){
  const ok=k===x.a;
  for(const b of document.querySelectorAll(".opt")){b.disabled=true;const bk=b.dataset.k;if(bk===x.a)b.classList.add("ok");else if(bk===k)b.classList.add("bad");else b.classList.add("dim")}
  const right=x.o.find(o=>o[0]===x.a);
  const fb=document.getElementById("fb");fb.className="fb show "+(ok?"ok":"bad");
  fb.innerHTML=ok?(x.neg?"Σωστά! Αυτή είναι η λάθος πρόταση.":"Σωστά!"):`Όχι ακριβώς.<small>Σωστή απάντηση: ${esc(x.s==="tf"?right[1]:x.a+") "+right[1])}</small>`;
  if(count){fb.scrollIntoView({block:"nearest",behavior:"smooth"});st.res[x.n]=ok?"ok":"bad";st.pick=st.pick||{};st.pick[x.n]=k;save();score()}
}
function go(d){if(!list.length)return;st.pos=Math.min(list.length-1,Math.max(0,st.pos+d));save();render(true);window.scrollTo({top:0,behavior:"smooth"})}
document.getElementById("card").addEventListener("click",e=>{
  const x=list[st.pos];if(!x)return;
  const o=e.target.closest(".opt");if(o&&!o.disabled){mark(x,o.dataset.k,true);return}
  if(e.target.id==="show"){document.getElementById("sol").classList.add("show");e.target.style.display="none";if(!st.res[x.n])document.getElementById("self").classList.add("show");return}
  const s=e.target.closest(".self .big");if(s){st.res[x.n]=s.dataset.v;save();score();document.getElementById("self").classList.remove("show")}
});
document.getElementById("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.sec=b.dataset.s;st.pos=0;build();chips();save();render(true)});
document.getElementById("shuf").addEventListener("click",()=>{st.shuf=!st.shuf;st.seed=Math.floor(Math.random()*2e9)+1;st.pos=0;build();chips();save();render(true)});
document.getElementById("wrong").addEventListener("click",()=>{st.wrong=!st.wrong;st.pos=0;build();chips();save();render(true)});
document.getElementById("reset").addEventListener("click",()=>{st.res={};st.pick={};st.pos=0;st.wrong=false;build();chips();save();score();render(true)});
document.getElementById("prev").addEventListener("click",()=>go(-1));
document.getElementById("next").addEventListener("click",()=>go(1));
document.getElementById("go").addEventListener("change",e=>{const n=+e.target.value;st.sec="all";st.wrong=false;st.shuf=false;build();chips();const i=list.findIndex(x=>x.n===n);if(i>=0){st.pos=i;save();render(true)}e.target.value=""});
document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;if(e.key==="ArrowRight")go(1);if(e.key==="ArrowLeft")go(-1)});
build();chips();score();render(false);
}
</script>
</body>
</html>
